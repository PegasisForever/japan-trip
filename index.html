<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- See-through: the map runs under the clock (iOS 26 adds a light blur there) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Yukimichi" />
    <meta name="description" content="Yukimichi: a 15-day winter trip, Tokyo to Osaka to Hokkaido, January 2027. Anime spots, JDM driving, Mt Fuji, Kyoto, Nara and Hokkaido snow." />
    <meta name="theme-color" content="#12263a" />
    <title>Yukimichi 雪道</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Safety net for the installed app: still blank 8 s after opening means stored files do not match.
      // Clear the stored copy and load once more from the network (once per open, so it cannot loop).
      setTimeout(function () {
        var root = document.getElementById('root')
        if (root && root.children.length) return
        try {
          if (sessionStorage.getItem('yukimichi-healed')) return
          sessionStorage.setItem('yukimichi-healed', '1')
        } catch (e) {}
        var jobs = []
        if ('serviceWorker' in navigator)
          jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
            return Promise.all(rs.map(function (r) { return r.unregister() }))
          }))
        if (window.caches)
          jobs.push(caches.keys().then(function (ks) {
            return Promise.all(ks.filter(function (k) { return k !== 'tiles' && k !== 'photos' }).map(function (k) { return caches.delete(k) }))
          }))
        Promise.all(jobs).then(function () { location.reload() }, function () { location.reload() })
      }, 8000)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
